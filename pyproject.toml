[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-sync"
version = "0.1.0"
description = "Automated Documentation Sync — AST-based Python docstring and API route sync to Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Automated Doc Sync Contributors" }]
dependencies = [
    "click>=8.1",
    "pathspec>=0.12",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
doc-sync = "doc_sync.entrypoints.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_sync"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["doc_sync"]
branch = true

[tool.coverage.report]
fail_under = 50
show_missing = true
